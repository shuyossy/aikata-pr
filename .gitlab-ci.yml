# .gitlab-ci.yml
# 本プロジェクトで利用するCI/CDパイプライン

stages:
  - test
  - build
  - release
  - publish

# 共通設定
default:
  image: node:22

# キャッシュ設定
.node_cache:
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/

# テストジョブ
test:
  stage: test
  extends: .node_cache
  script:
    - npm ci
    - npm run test:coverage
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'

# Lint/Format チェックジョブ
lint:
  stage: test
  extends: .node_cache
  script:
    - npm ci
    - npm run lint
    - npm run format:check

# Dockerイメージビルドジョブ
build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# リリースジョブ（semantic-release）
release:
  stage: release
  extends: .node_cache
  script:
    - npm ci
    - touch release.env
    - npx semantic-release
  artifacts:
    reports:
      dotenv: release.env
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# Container Registryへのタグ付け・push
publish:
  stage: publish
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  needs:
    - job: build
    - job: release
      artifacts: true
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - |
      if [ -z "$RELEASE_VERSION" ]; then
        echo "No release was created. Skipping publish."
        exit 0
      fi
    - docker pull "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" "$CI_REGISTRY_IMAGE:${RELEASE_VERSION}"
    - docker tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" "$CI_REGISTRY_IMAGE:latest"
    - docker push "$CI_REGISTRY_IMAGE:${RELEASE_VERSION}"
    - docker push "$CI_REGISTRY_IMAGE:latest"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# npm Registry への公開
publish-npm:
  stage: publish
  image: node:22
  needs:
    - job: release
      artifacts: true
  script:
    - |
      if [ -z "$RELEASE_VERSION" ]; then
        echo "No release was created. Skipping npm publish."
        exit 0
      fi
    - npm ci
    - npm run build:cli
    - echo "@aikata:registry=https://${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/packages/npm/" > .npmrc
    - echo "//${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/packages/npm/:_authToken=${CI_JOB_TOKEN}" >> .npmrc
    - npm publish
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
