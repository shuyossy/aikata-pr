# .gitlab-ci.yml
# 本プロジェクトで利用するCI/CDパイプライン

stages:
  - test
  - build
  - release
  - publish

# 共通設定
default:
  image: node:22

# キャッシュ設定
.node_cache:
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/

# テストジョブ
test:
  stage: test
  extends: .node_cache
  script:
    - npm ci
    - npm run test:coverage
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'

# Lint/Format チェックジョブ
lint:
  stage: test
  extends: .node_cache
  script:
    - npm ci
    - npm run lint
    - npm run format:check

# ビルドジョブ
build:
  stage: build
  extends: .node_cache
  script:
    - npm ci
    - npm run build:cli
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# リリースジョブ（semantic-release）
release:
  stage: release
  extends: .node_cache
  needs:
    - job: build
      artifacts: true
  script:
    - npm ci
    - touch release.env
    - npx semantic-release
  artifacts:
    reports:
      dotenv: release.env
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# パッケージ公開ジョブ（GitLab Generic Packages Registry）
publish:
  stage: publish
  needs:
    - job: build
      artifacts: true
    - job: release
      artifacts: true
  script:
    - |
      if [ -z "$RELEASE_VERSION" ]; then
        echo "No release was created. Skipping publish."
        exit 0
      fi
    - echo "Publishing version ${RELEASE_VERSION} to GitLab Generic Packages Registry..."
    - |
      curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --upload-file dist/index.js \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/aikata-pr/${RELEASE_VERSION}/index.js"
    - |
      curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --upload-file dist/index.js.map \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/aikata-pr/${RELEASE_VERSION}/index.js.map"
    - echo "Published index.js and index.js.map for version ${RELEASE_VERSION}"
    # 既存の "latest" パッケージを削除してからアップロード
    - |
      EXISTING_ID=$(curl --silent --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages?package_name=aikata-pr&package_version=latest" | \
        node -e "const d=require('fs').readFileSync('/dev/stdin','utf8');const p=JSON.parse(d);if(p[0])console.log(p[0].id)")
      if [ -n "$EXISTING_ID" ]; then
        echo "Deleting existing latest package (ID: ${EXISTING_ID})..."
        curl --fail --request DELETE --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/${EXISTING_ID}"
      fi
    - |
      curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --upload-file dist/index.js \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/aikata-pr/latest/index.js"
    - |
      curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --upload-file dist/index.js.map \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/aikata-pr/latest/index.js.map"
    - echo "Published latest package"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
