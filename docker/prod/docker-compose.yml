services:
  aikata-pr-api:
    build:
      context: ../..
      dockerfile: Dockerfile
    command: ["aikata-pr", "server"]
    ports:
      - "${API_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - AIKATA_PR_VERSION
      - AI_API_KEY
      - AI_API_ENDPOINT_URL
      - AI_MODEL_NAME
      - OPENAI_REASONING_EFFORT
      - MAX_CONTEXT_LENGTH
      - JWT_JWKS_URL
      - JWT_AUDIENCE
      - JWT_ISSUER
      - AI_API_RATE_LIMIT_PER_MIN
      - MAX_CONCURRENT_CLONES
      - CLONE_TIMEOUT_MS
      - REVIEW_TIMEOUT_MS
      - CLONE_MAX_DISK_MB
      - AIKATA_LOG_LEVEL
      - GITLAB_API_URL
      # === SSE接続耐性（ジョブ結果ストア） ===
      - JOB_RESULT_STORE_DIR=/var/lib/aikata-pr/job-results
      - JOB_RESULT_TTL_MS
      - JOB_RESULT_SWEEP_INTERVAL_MS
    volumes:
      - /tmp/aikata-pr-clones:/tmp/aikata-pr-clones
      # ジョブ結果（SSE接続耐性）の永続化先。コンテナ再起動でも保持
      - aikata-pr-job-results:/var/lib/aikata-pr/job-results
    restart: unless-stopped

volumes:
  aikata-pr-job-results:
