# .ci-template/pipelines/template-npx.yml
# 後方互換用のファサード。review(npx方式)ジョブの実体は review/template-npx.yml を参照。
# 既存ユーザはこのファイルをincludeし続けることで変更不要で動作する。
#
# 使い方（既存ユーザ）:
#   include:
#     - project: '<本プロジェクトのパス>'
#       file: '.ci-template/pipelines/template-npx.yml'
#
# 新規ユーザは機能別ファイルを直接includeすることを推奨:
#   include:
#     - project: '<本プロジェクトのパス>'
#       file: '.ci-template/jobs/review/template-npx.yml'

include:
  - local: '.ci-template/jobs/review/template-npx.yml'
