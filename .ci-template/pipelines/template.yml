# .ci-template/pipelines/template.yml
# 提供先プロジェクトで include して利用するCIテンプレート
#
# 使い方:
#   include:
#     - project: '<本プロジェクトのパス>'
#       file: '.ci-template/pipelines/template.yml'

include:
  - local: '.ci-template/variable/variables.yml'

stages:
  - review

ai-review:
  stage: review
  image: node:22
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    # AIKATA_PR_DISABLED=trueの場合、AIレビューをスキップ
    - |
      if [ "$AIKATA_PR_DISABLED" = "true" ]; then
        echo "AIKATA_PR_DISABLED is set to true. Skipping AI review."
        exit 0
      fi
    # チェックロジックをGeneric PackagesからDL（一時ディレクトリに保存し、既存ファイルとの衝突を回避）
    # DLしたチェックロジック実行
    - |
      AIKATA_WORK_DIR=$(mktemp -d)
      PACKAGE_URL="${CI_API_V4_URL}/projects/${AIKATA_PROJECT_ID}/packages/generic/aikata-pr/latest/index.js"
      curl --header "PRIVATE-TOKEN: ${AIKATA_DOWNLOAD_TOKEN}" -o "${AIKATA_WORK_DIR}/index.js" "${PACKAGE_URL}"
      node "${AIKATA_WORK_DIR}/index.js" \
        --user-id "${USER_ID}" \
        --project-id "${GITLAB_PROJECT_ID}" \
        --mr-iid "${GITLAB_MR_IID}" \
        --checklist "${CHECKLIST_PATH}" \
        --review-settings "${REVIEW_SETTINGS_PATH}" \
        --skills "${SKILLS_PATH}" \
        --log-level "${LOG_LEVEL}"
