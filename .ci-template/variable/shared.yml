# .ci-template/variable/shared.yml
# 全機能共通のCI変数デフォルト値
variables:
  # VERSION
  AIKATA_PR_VERSION: "latest"
  # GitLab
  GITLAB_API_URL: ""
  AIKATA_PR_GITLAB_TOKEN: ""
  GITLAB_PROJECT_ID: "$CI_PROJECT_ID"
  # AI共通
  AI_API_KEY: ""
  AI_API_ENDPOINT_URL: ""
  AI_MODEL_NAME: ""
  OPENAI_REASONING_EFFORT: ""
  # Feature Toggle
  AIKATA_PR_DISABLED: "false"
  # Settings
  USER_ID: "$GITLAB_USER_LOGIN"
  AIKATA_LOG_LEVEL: "info"
  # API Mode (AI_API_KEY, AI_API_ENDPOINT_URL, AI_MODEL_NAMEが全て未設定時に必要)
  AIKATA_API_URL: ""
  # Container Image（Docker方式用）
  AIKATA_IMAGE: ""
  # npm（npx方式用）
  AIKATA_PROJECT_ID: ""
  # Context Length（AI全般で使う可能性）
  MAX_CONTEXT_LENGTH: ""
  # === API mode network resilience（CLI側、APIモード時に有効） ===
  # fetchリトライ
  JOB_FETCH_RETRY_COUNT: "5"
  JOB_FETCH_RETRY_BASE_MS: "1000"
  JOB_FETCH_RETRY_MAX_MS: "16000"
  # ジョブ結果ポーリング設定
  JOB_RESULT_POLL_INTERVAL_MS: "5000"
  JOB_RESULT_POLL_TIMEOUT_MS: "2100000"
  JOB_RESULT_POLL_NOT_FOUND_GRACE_MS: "60000"
